<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do dono | Assis Leite</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#172b3a;font-family:Arial,sans-serif}.bar{background:#102a43;color:white;padding:22px 5%;display:flex;justify-content:space-between}.bar a{color:#f0c36b;text-decoration:none}.wrap{max-width:850px;margin:35px auto;padding:0 18px}.panel{background:white;border:1px solid #e0e8ee;border-radius:13px;padding:26px;margin-bottom:20px;box-shadow:0 8px 25px #17344a0b}h1,h2{color:#102a43;margin-top:0}.hint{color:#65798a;font-size:14px;line-height:1.6}label{display:block;font-size:13px;font-weight:bold;margin:13px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #ccd8e1;border-radius:7px;font:inherit}textarea{min-height:85px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:7px;padding:12px 17px;background:#102a43;color:white;font-weight:bold;cursor:pointer;margin-top:15px}.secondary{background:#e8eef2;color:#102a43}.danger{background:#a93232;margin-left:7px}.hidden{display:none}.item{padding:14px 0;border-bottom:1px solid #e5ebef}.item small{color:#627587;display:block}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:19px}}
</style></head><body><header class="bar"><b>ASSIS LEITE · PAINEL DO DONO</b><a href="index.html">← Voltar à loja</a></header><main class="wrap">
<section class="panel" id="loginPanel"><h1>Login do proprietário</h1><p class="hint">Entre com o usuário criado em Firebase Authentication.</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><button class="btn" id="login">Entrar</button><p class="hint" id="loginMsg"></p></section>
<section class="panel hidden" id="appPanel"><h1>Cadastro de produtos</h1><p class="hint">Os produtos salvos aqui aparecem na loja pública.</p><form id="form"><div class="grid"><div><label>Nome *</label><input id="nome" required></div><div><label>Preço (R$) *</label><input id="preco" type="number" min="0" step=".01" required></div></div><label>Descrição *</label><textarea id="descricao" required></textarea><div class="grid"><div><label>Localização no depósito</label><input id="localizacao" placeholder="Ex.: Corredor 2, prateleira B"></div><div><label>Link da imagem (opcional)</label><input id="imagem" type="url"></div></div><button class="btn">Salvar produto</button><button class="btn secondary" type="button" id="clear">Limpar</button><p class="hint" id="msg"></p></form><h2>Produtos cadastrados</h2><div id="list"></div><button class="btn secondary" id="logout">Sair</button></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,updateDoc,serverTimestamp,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const cfg={apiKey:"AIzaSyBaoUIuPzxWWRfYi5yA6mR-yakc1f1ZzaY",authDomain:"projeto-teste-2027.firebaseapp.com",projectId:"projeto-teste-2027",storageBucket:"projeto-teste-2027.firebasestorage.app",messagingSenderId:"656064645546",appId:"1:656064645546:web:c0b39c8517abec430a43d3",measurementId:"G-PPWNLCSY9Q"},app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id);let editing=null;
$("login").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value)}catch(e){$("loginMsg").textContent="Falha no login. Confira e-mail, senha e ativação do Authentication."}};
onAuthStateChanged(auth,u=>{$("loginPanel").classList.toggle("hidden",!!u);$("appPanel").classList.toggle("hidden",!u);if(u)refresh()});$("logout").onclick=()=>signOut(auth);$("clear").onclick=()=>{$("form").reset();editing=null};
$("form").onsubmit=async e=>{e.preventDefault();let p={nome:$("nome").value.trim(),preco:Number($("preco").value),descricao:$("descricao").value.trim(),localizacao:$("localizacao").value.trim(),imagem:$("imagem").value.trim()};try{if(editing)await updateDoc(doc(db,"produtos",editing),p);else await addDoc(collection(db,"produtos"),{...p,criadoEm:serverTimestamp()});$("form").reset();editing=null;$("msg").textContent="Produto salvo.";refresh()}catch(err){$("msg").textContent="Erro ao salvar. Verifique as regras do Firestore e o UID autorizado."}};
async function refresh(){let el=$("list");try{let s=await getDocs(query(collection(db,"produtos"),orderBy("criadoEm","desc")));el.innerHTML=s.empty?'<p class="hint">Nenhum produto cadastrado.</p>':s.docs.map(d=>`<div class="item"><b>${safe(d.data().nome)} — ${Number(d.data().preco||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</b><small>${safe(d.data().descricao)}</small><button class="btn secondary" data-edit="${d.id}">Editar</button><button class="btn danger" data-del="${d.id}">Excluir</button></div>`).join("");el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let p=s.docs.find(x=>x.id===b.dataset.edit).data();editing=b.dataset.edit;["nome","preco","descricao","localizacao","imagem"].forEach(k=>$(k).value=p[k]??"");window.scrollTo({top:0,behavior:"smooth"})});el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Excluir produto?")){await deleteDoc(doc(db,"produtos",b.dataset.del));refresh()}})}catch(e){el.textContent="Erro ao carregar. Confira as regras do Firestore."}}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
